name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scanner/requirements.txt
      - name: scanner smoke test
        run: python scanner/scanner.py demo-repo -o /tmp/findings.json

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard

      - name: package artifacts
        run: |
          mkdir -p release/cipherscope
          cp -r scanner release/cipherscope/
          cp -r demo-repo release/cipherscope/
          cp -r dashboard/dist release/cipherscope/dashboard-dist
          cp README.md LICENSE CHANGELOG.md release/cipherscope/
          cd release && zip -r "../cipherscope-${GITHUB_REF_NAME}.zip" cipherscope

      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: cipherscope-*.zip
