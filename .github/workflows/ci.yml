name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    name: scanner runs clean on demo-repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scanner/requirements.txt
      - name: run scanner
        run: python scanner/scanner.py demo-repo -o dashboard/src/findings.json
      - name: validate findings.json
        run: |
          python - <<'EOF'
          import json
          findings = json.load(open("dashboard/src/findings.json"))
          assert isinstance(findings, list) and len(findings) > 0
          required = {"file", "line", "algorithm", "key_size", "category",
                      "weak_today", "quantum_vulnerable", "severity", "recommendation"}
          assert all(required <= set(f) for f in findings)
          print(f"OK — {len(findings)} valid findings")
          EOF

  build:
    name: dashboard builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
