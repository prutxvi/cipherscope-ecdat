name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          args: check scanner tests

  test:
    name: tests (scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scanner/requirements.txt
      - name: run test suite
        run: python -m unittest discover -s tests -v
      - name: scan demo-repo (smoke)
        run: python scanner/scanner.py demo-repo -o dashboard/src/findings.json
      - name: validate findings.json
        run: |
          python - <<'EOF'
          import json
          findings = json.load(open("dashboard/src/findings.json"))
          assert isinstance(findings, list) and len(findings) > 0
          required = {"file", "line", "algorithm", "key_size", "category",
                      "weak_today", "quantum_vulnerable", "severity", "recommendation"}
          assert all(required <= set(f) for f in findings)
          print(f"OK — {len(findings)} valid findings")
          EOF

  build:
    name: build (dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard

  code-scanning:
    name: code scanning (SARIF)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scanner/requirements.txt
      - name: generate SARIF
        run: python scanner/scanner.py demo-repo --format sarif -o cipherscope.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: cipherscope.sarif
