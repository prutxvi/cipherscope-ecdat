# ACME Corp — legacy edge config (migrated from 2014 puppet manifests)
# legacy.acme-corp.internal serves the old partner portal (TLS 1.0/1.1 required by contract)

upstream payments {
    server payments-api:8000;
}

server {
    listen 443 ssl;
    server_name legacy.acme-corp.internal;

    ssl_certificate     /etc/nginx/certs/legacy_api.crt;
    ssl_certificate_key /etc/nginx/certs/legacy_api.key;

    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers RC4-SHA:HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://payments;
    }
}

# modern API surface (2023)
server {
    listen 8443 ssl;
    server_name api.acme-corp.internal;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols TLSv1.3;
    ssl_ciphers TLS-AES-256-GCM-SHA384:TLS-CHACHA20-POLY1305-SHA256;

    location / {
        proxy_pass http://payments;
    }
}
